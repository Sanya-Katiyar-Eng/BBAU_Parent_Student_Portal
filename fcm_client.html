import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Firebase Notification Test</title>
</head>

<body>

    <h2>Firebase Notification Test</h2>

    <button id="notifyBtn">
        Enable Notifications
    </button>

    <p id="status">Waiting...</p>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

        import {
            getMessaging,
            getToken
        } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyAiIajdSZtR3e9clD5MHRbFjMBThAO4bCc",

            authDomain:
                "bbau-student-parent-portal.firebaseapp.com",

            projectId:
                "bbau-student-parent-portal",

            storageBucket:
                "bbau-student-parent-portal.firebasestorage.app",

            messagingSenderId:
                "625608588923",

            appId:
                "1:625608588923:web:a5a23ffdca5d45cc25ecde"
        };


        const app =
            initializeApp(firebaseConfig);

        const messaging =
            getMessaging(app);


        document.getElementById("notifyBtn").onclick =
            async function () {

                const status =
                    document.getElementById("status");

                try {

                    status.innerText =
                        "Requesting notification permission...";


                    const permission =
                        await Notification.requestPermission();


                    if (permission !== "granted") {

                        status.innerText =
                            "Notification permission denied ❌";

                        return;
                    }


                    status.innerText =
                        "Registering service worker...";


                    // Register Firebase Service Worker
                    const registration =
                        await navigator.serviceWorker.register(
                            "/firebase-messaging-sw.js"
                        );


                    console.log(
                        "Service Worker:",
                        registration
                    );


                    status.innerText =
                        "Getting FCM token...";


                    const token =
                        await getToken(
                            messaging,
                            {
                                vapidKey:
                                    "BE9MU02xveICBgQlS0L2NyTwSwxIfvfC_JQuVaEgpc5NdWJbNb84rYRHeqUZRL1qxb3FIpGnwktMArjlo9hKwMU",

                                serviceWorkerRegistration:
                                    registration
                            }
                        );


                    console.log(
                        "FCM TOKEN:",
                        token
                    );


                    if (!token) {

                        status.innerText =
                            "FCM token was not generated ❌";

                        return;
                    }


                    // Parent ID
                    const urlParams =
                        new URLSearchParams(
                            window.location.search
                        );

                    const parentId =
                        urlParams.get("parent_id");


                    console.log(
                        "PARENT ID:",
                        parentId
                    );


                    if (!parentId) {

                        status.innerText =
                            "Parent ID not found ❌";

                        return;
                    }


                    status.innerText =
                        "Saving FCM token...";


                    const response =
                        await fetch(
                            "http://localhost:8000/save-fcm-token",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    parent_id:
                                        parseInt(parentId),

                                    fcm_token:
                                        token
                                })
                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "SERVER RESPONSE:",
                        result
                    );


                    if (result.success) {

                        status.innerText =
                            "FCM Token saved to database ✅";

                    } else {

                        status.innerText =
                            "Token save failed ❌";
                    }


                } catch (error) {

                    console.error(
                        "FCM ERROR:",
                        error
                    );

                    status.innerText =
                        "FCM ERROR: " +
                        error.message;
                }

            };

    </script>

</body>

</html>
